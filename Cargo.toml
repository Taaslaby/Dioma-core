# Dioma — НЕ воркспейс: path-зависимости указывают в crates/SiMuse, у
# которого свой [workspace] + Cargo.lock + workspace-наследование. Если бы
# dioma был воркспейс-корнем, cargo резолвил бы `workspace = true` крейтов
# SiMuse против dioma (вложенные воркспейсы не поддерживаются) и падал бы на
# отсутствующих workspace.package/workspace.dependencies. Без [workspace] у
# dioma крейты SiMuse находят свой корень обычным walk-up, как до переноса.

[package]
name = "dioma"
version = "0.2.0"
edition = "2021"
description = "Headless backend for Unity: выращиваемые спайковые существа (cdylib). Референс для com.dioma.engine"

[lib]
# Unity загружает cdylib через P/Invoke; rlib остаётся для Rust-бинов и тестов.
crate-type = ["rlib", "cdylib"]

[dependencies]
dioma-engine = { path = "crates/dioma-engine" }
taas-format = { path = "crates/SiMuse/crates/taas-format" }
serde_json = "1"
rayon = "1"

[dev-dependencies]
pillars = { path = "crates/SiMuse/crates/pillars" }

# ── Экспортёр коннектома для Unity-порта (golden trace паритета) ──

[[bin]]
name = "export_connectome"
path = "src/bin/export_connectome.rs"

# ── Экспортёр золотого следа биохимии (паритет Bio-модуля) ──

[[bin]]
name = "export_bio"
path = "src/bin/export_bio.rs"

# ── Экспортёр эталонного .taas (совместимость формата с портом) ──

[[bin]]
name = "export_taas"
path = "src/bin/export_taas.rs"

# ── Экспортёр протокола обучения (ящик Скиннера: мозг УЧИТСЯ) ──

[[bin]]
name = "export_learning"
path = "src/bin/export_learning.rs"


