[package]
name = "dioma"
version = "0.2.0"
edition = "2021"
description = "Игра о выращиваемых спикинг-агентах поверх движка taas-checkmate"

[dependencies]
pillars = { path = "../Проекты/asm_engines/taas_checkmate/crates/pillars" }
pillars-connectome = { path = "../Проекты/asm_engines/taas_checkmate/crates/pillars-connectome" }
prometheus-grow = { path = "../Проекты/asm_engines/taas_checkmate/crates/prometheus-grow" }
taas-format = { path = "../Проекты/asm_engines/taas_checkmate/crates/taas-format" }
# Когнитивный рантайм karmac (SpikingBrain: каналы→GNW→базальные ганглии).
taas-checkmate = { path = "../Проекты/asm_engines/taas_checkmate", default-features = false, features = ["karmac"] }
rayon = "1"
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"

# ── Активные бины (протоколы и обсерватории); история — в archive/bins ──

[[bin]]
name = "dynasty"
path = "src/bin/dynasty.rs"

[[bin]]
name = "evolved-rules"
path = "src/bin/evolved_rules.rs"

[[bin]]
name = "skinner-box"
path = "src/bin/skinner_box.rs"

[[bin]]
name = "conditioning"
path = "src/bin/conditioning.rs"

[[bin]]
name = "exam"
path = "src/bin/exam.rs"

[[bin]]
name = "poc-heredity"
path = "src/bin/poc_heredity.rs"

[[bin]]
name = "maze-test"
path = "src/bin/maze_test.rs"

[[bin]]
name = "brain-battle"
path = "src/bin/brain_battle.rs"

[[bin]]
name = "sardana-probe"
path = "src/bin/sardana_probe.rs"

[[bin]]
name = "evolution"
path = "src/bin/evolution.rs"

[[bin]]
name = "observatory"
path = "src/bin/observatory.rs"

[[bin]]
name = "observatory-eco"
path = "src/bin/observatory_eco.rs"
