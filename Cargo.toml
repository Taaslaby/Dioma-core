[package]
name = "dioma"
version = "0.1.0"
edition = "2021"
description = "Игра о выращиваемых спикинг-агентах поверх движка taas-checkmate"

[dependencies]
pillars = { path = "../Проекты/asm_engines/taas_checkmate/crates/pillars" }
pillars-connectome = { path = "../Проекты/asm_engines/taas_checkmate/crates/pillars-connectome" }
prometheus-grow = { path = "../Проекты/asm_engines/taas_checkmate/crates/prometheus-grow" }
taas-format = { path = "../Проекты/asm_engines/taas_checkmate/crates/taas-format" }
# Когнитивный рантайм karmac (SpikingBrain: каналы→GNW→базальные ганглии).
taas-checkmate = { path = "../Проекты/asm_engines/taas_checkmate", default-features = false, features = ["karmac"] }
rayon = "1"
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"

[[bin]]
name = "poc-reflex"
path = "src/bin/reflex.rs"

