[package]
name = "dioma-engine"
version = "0.2.0"
edition = "2021"
description = "Runtime движка Dioma: существа, биохимия, мир и симуляция"

[dependencies]
pillars = { path = "../SiMuse/crates/pillars" }
pillars-connectome = { path = "../SiMuse/crates/pillars-connectome" }
pillars-wgpu = { path = "../SiMuse/crates/pillars-wgpu" }
prometheus-grow = { path = "../SiMuse/crates/prometheus-grow", features = ["gpu"] }
pollster = "0.3"
taas-format = { path = "../SiMuse/crates/taas-format" }
rayon = "1"
wide = "0.7"

[dev-dependencies]
# Научная станция (examples/sci.rs): окно + egui. Ядро движка от окна не зависит.
winit = "0.30"
wgpu = { version = "22", features = ["wgsl"] }
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
pollster = "0.3"
