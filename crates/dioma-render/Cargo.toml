[package]
name = "dioma-render"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "dioma-render — 2D спрайтовый рендер-движок на wgpu"

[dependencies]
# wgpu 24 — выбрано под egui-wgpu 0.31 (он пиннит ровно wgpu ^24). Остальная
# цепочка (dioma-engine, SiMuse/pillars-wgpu) пока на wgpu 22 — версии
# сосуществуют в одном бинарнике как разные крейты.
wgpu = { version = "24", features = ["wgsl"] }
bytemuck = "1"
png = "0.17"
# Spine: декодирование страницы атласа из памяти.
image = { version = "0.25", default-features = false, features = ["png"] }
# UI-карта: декларативные сцены (JSON) — контракт с Sprite Forge.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Текст UI: растеризация TTF (кириллица) в атлас глифов.
fontdue = "0.9"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

[dev-dependencies]
pollster = "0.3"
winit = "0.30"
